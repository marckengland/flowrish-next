name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

# Do not cancel an active production migration. Keep PR runs independent.
concurrency:
  group: ${{ github.event_name == 'push' && 'flowrish-production-release' || format('flowrish-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Test/CI placeholder values — required at config-load time by prisma.config.ts
      # and by env validation in the test runtime. Real secrets live in deployment.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      UPSTASH_REDIS_REST_URL: http://localhost:6379
      UPSTASH_REDIS_REST_TOKEN: test-redis-token
      INNGEST_SIGNING_KEY: test-inngest-signing-key
      INNGEST_EVENT_KEY: test-inngest-event-key
      EMAIL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AI_API_URL: http://localhost:8080
      AI_API_KEY: test-ai-key
      AI_MODEL: test-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npx vitest --run

  receptionist-browser:
    name: Mocked receptionist browser rehearsal
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rehearsal
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma types with dummy configuration
        run: npx prisma generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated mocked receptionist workflows
        run: npm run test:receptionist:mocked

  inbox-performance:
    name: Synthetic inbox regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Generation/install hooks receive only inert placeholders; the runner owns its database.
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/unused
      DIRECT_URL: postgresql://synthetic:synthetic@127.0.0.1:1/unused
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma types with dummy configuration
        run: npx prisma generate
      - name: Prepare the existing PostgreSQL image by immutable digest
        run: |
          docker pull postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
          docker tag postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1 postgres:17
      - name: Run isolated synthetic inbox regressions
        run: npm run test:inbox:performance

  migrate:
    name: Apply Prisma Migrations
    runs-on: ubuntu-latest
    needs: [ci, receptionist-browser, inbox-performance]
    # Only run after a successful merge to main — never on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    timeout-minutes: 15
    env:
      # Install hooks never receive production credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/release
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          CI_RESULT: ${{ needs.ci.result }}
          BROWSER_RESULT: ${{ needs.receptionist-browser.result }}
          INBOX_PERFORMANCE_RESULT: ${{ needs.inbox-performance.result }}
        run: node scripts/production-release.mjs migrate

  release-ready:
    # A skipped PR job must never satisfy the production check for the same SHA.
    name: ${{ github.event_name == 'push' && 'Production release ready' || 'PR release not requested' }}
    runs-on: ubuntu-latest
    needs: [ci, receptionist-browser, inbox-performance, migrate]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify exact production commit and prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.ci.result }}
          BROWSER_RESULT: ${{ needs.receptionist-browser.result }}
          INBOX_PERFORMANCE_RESULT: ${{ needs.inbox-performance.result }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
        run: node scripts/production-release.mjs ready

  production-smoke:
    name: ${{ github.event_name == 'push' && 'Production smoke verification' || 'PR smoke not requested' }}
    runs-on: ubuntu-latest
    needs: [release-ready]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify the live production commit and anonymous access
        env:
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-smoke.mjs
