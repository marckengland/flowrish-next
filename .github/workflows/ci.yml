name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    env:
      # Test/CI placeholder values — required at config-load time by prisma.config.ts
      # and by env validation in the test runtime. Real secrets live in deployment.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      UPSTASH_REDIS_REST_URL: http://localhost:6379
      UPSTASH_REDIS_REST_TOKEN: test-redis-token
      INNGEST_SIGNING_KEY: test-inngest-signing-key
      INNGEST_EVENT_KEY: test-inngest-event-key
      EMAIL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AI_API_URL: http://localhost:8080
      AI_API_KEY: test-ai-key
      AI_MODEL: test-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npx vitest --run

  migrate:
    name: Apply Prisma Migrations
    runs-on: ubuntu-latest
    needs: ci
    # Only run after a successful merge to main — never on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # The job is gated on the SUPABASE_DB_URL secret existing. If the
    # repo doesn't have it configured (for example, on a fork or in a
    # transitional environment) we skip rather than fail the run.
    # The connection string must include `?sslmode=require` for Supabase.
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Skip when DATABASE_URL is not configured
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "DATABASE_URL secret is not set; skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Apply Prisma migrations
        if: steps.gate.outputs.skip != 'true'
        # `prisma migrate deploy` applies every pending migration in
        # `prisma/migrations/` against DATABASE_URL. It's the
        # production-safe sibling of `migrate dev` — it never prompts
        # and never modifies the schema beyond the migration files.
        run: npx prisma migrate deploy
